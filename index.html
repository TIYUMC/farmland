<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Framland· Phase 1</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="game-container">
    <!-- HUD 顶栏 -->
    <div id="hud-bar">
      <div class="hud-item"><span class="hud-label" id="hud-ico-time">⏰</span><span id="hud-datetime">春1日 第1年 06:00</span></div>
      <div class="hud-item">
        <span class="hud-label" id="hud-ico-stamina">⚡</span>
        <div id="stamina-bar-bg"><div id="stamina-bar-fill"></div></div>
        <span id="hud-stamina">20/20</span>
      </div>
      <div class="hud-item"><span class="hud-label" id="hud-ico-money">💰</span><span id="hud-money">128</span></div>
    </div>

    <!-- 游戏画布 -->
    <canvas id="game-canvas"></canvas>
    <!-- 商店物品图标叠层（DOM 渲染，清晰度与工具栏一致） -->
    <div id="shop-icons"></div>

    <!-- 底部工具栏 -->
    <div id="toolbar">
      <div class="tool-btn held-slot" id="held-slot">
        <div class="tool-icon" id="held-icon"></div>
        <div class="tool-name" id="held-name"></div>
      </div>
      <div class="tool-separator"></div>
      <div class="tool-btn" id="btn-shop">
        <div class="tool-icon">🏪</div>
        <div class="tool-name">商店</div>
      </div>
      <div class="tool-btn" id="btn-sleep">
        <div class="tool-icon">🛌</div>
        <div class="tool-name">睡觉</div>
      </div>
      <div class="tool-btn" id="btn-debug">
        <div class="tool-icon">⚡</div>
        <div class="tool-name">调试</div>
      </div>
    </div>

    <!-- 状态提示 -->
    <div id="status-message" class="status-hidden"></div>
    <div id="busy-indicator" class="busy-hidden">
      <img id="busy-icon" class="busy-icon" alt="" src="">
      <span id="busy-text">正在…中</span>
      <div class="busy-bar"><div id="busy-fill"></div></div>
    </div>

    <!-- 背包界面（MC 物品栏 GUI：inventory.png 纹理背景） -->
    <div id="inventory-overlay" class="overlay-hidden">
      <div id="inventory-panel">
        <div id="inv-topbar">
          <div class="tool-btn" id="btn-inv-shop"><div class="tool-icon"></div><div class="tool-name">商店</div></div>
          <div class="tool-btn" id="btn-inv-sleep"><div class="tool-icon"></div><div class="tool-name">睡觉</div></div>
          <div class="tool-btn" id="btn-inv-debug"><div class="tool-icon"></div><div class="tool-name">调试</div></div>
          <div class="tool-btn" id="btn-inv-book"><div class="tool-icon"></div><div class="tool-name">任务</div></div>
        </div>
        <div id="inv-money">
          <img id="inv-money-icon" alt="金币" src="">
          <span id="inv-money-val">0</span>
        </div>
        <!-- 主物品栏 9×3 -->
        <div id="inv-grid-main" class="inv-grid" role="grid" aria-label="物品栏"></div>
        <!-- 快捷栏 9×1：放置全部出售 -->
        <div id="inv-grid-hotbar" class="inv-grid" role="grid" aria-label="快捷栏"></div>
      </div>
    </div>

    <!-- 任务书面板（Advancement / 进度树）：背包内书按钮打开，关闭后回到背包 -->
    <div id="quest-overlay" class="overlay-hidden">
      <div id="quest-frame-wrap">
        <div id="quest-tabs"></div>
        <div id="quest-panel">
          <div id="quest-tree"></div>
        </div>
      </div>
    </div>

    <!-- 每日结算 -->
    <div id="day-summary" class="panel-hidden">
      <div id="summary-panel">
        <div id="summary-header">🌙 一天结束</div>
        <div id="summary-content"></div>
        <button id="summary-next">关闭</button>
      </div>
    </div>
  </div>

  <script src="js/assets.js"></script>
  <script src="js/data.js"></script>
  <script src="js/quest.js"></script>
  <script src="js/engine.js"></script>
  <script src="js/farm.js"></script>
  <script src="js/player.js"></script>
    <script src="js/economy.js"></script>
    <script src="js/juice.js"></script>
    <script src="js/ui.js"></script>
  <script src="js/inventory.js"></script>
  <script src="js/shop.js"></script>
  <script src="js/treefarm.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
